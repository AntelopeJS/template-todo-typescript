name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      renovate-sync: false
      test-job: true
      affected-tests: true
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  stress-temp:
    name: Stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present checks:prepare
      - env:
          CI: "1"
        run: |
          loops=$((4 * $(nproc)))
          for _ in $(seq "$loops"); do
            (while :; do :; done) &
          done
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          failed=0
          for run in 1 2 3; do
            if ! pnpm run test; then failed=$((failed + 1)); fi
          done
          echo "failed ${failed} of 3"
          [ "$failed" -eq 0 ]
